[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-session"
version = "1.0.4"
description = "Today's ssh session certificate and git key, into the ssh-agent: from the admin CA on a YubiKey, or from the account CA service"
requires-python = ">=3.11"
dependencies = ["click>=8"]

[project.scripts]
ssh-session = "ssh_session.cli:main"

[tool.setuptools.packages.find]
include = ["ssh_session*"]
